apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-canvas-controller-state
  namespace: agent-canvas-research
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard-rwo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-canvas-research-controller
  namespace: agent-canvas-research
spec:
  schedule: "*/15 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agent-canvas-research-controller
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
          containers:
            - name: controller
              image: ghcr.io/rajshah4/openhands-agent-research-controller:replace-me
              imagePullPolicy: IfNotPresent
              args:
                - --campaign
                - /app/examples/hard-transfer-live.json
                - --store
                - /state/research-lab
                - --base-url
                - http://agent-canvas-research:8000
              env:
                - name: HOME
                  value: /tmp
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: TMPDIR
                  value: /tmp
                - name: CANVAS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: agent-canvas-controller
                      key: canvas-api-key
                - name: CANVAS_PROFILE
                  valueFrom:
                    secretKeyRef:
                      name: agent-canvas-controller
                      key: canvas-profile
                      optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: agent-canvas-controller-state
            - name: temporary
              emptyDir: {}
