[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhands-agent-research-lab"
version = "0.1.0"
description = "A production-shaped OpenHands research organization for repeated, validated agent experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajiv Shah" }]
dependencies = []

[project.scripts]
research-lab = "research_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
